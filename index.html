<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine ❤️</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: pink;
        }
        .container {
            margin-top: 50px;
            padding: 20px;
            background: white;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
        }
        input, textarea {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background: red;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: darkred;
        }
    </style>
</head>
<body>
    <audio autoplay loop>
        <source src="music.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    <div class="container">
        <h1>Too Shy to Ask Directly 💖</h1>
        <p>Enter your details below for a sweet surprise! 🎁</p>
        <form id="valentineForm">
            <input type="text" id="name" placeholder="Your Name" required>
            <input type="tel" id="phone" placeholder="Your Phone Number" required>
            <input type="text" id="location" placeholder="Your Address" required>
            <textarea id="message" placeholder="Leave a sweet message..." required></textarea>
            <button type="submit">Send 💌</button>
        </form>
        <p id="response"></p>
    </div>
    <script>
        document.getElementById("valentineForm").addEventListener("submit", function(event) {
            event.preventDefault();

            let name = document.getElementById("name").value;
            let phone = document.getElementById("phone").value;
            let location = document.getElementById("location").value;
            let message = document.getElementById("message").value;

            if (name && phone && location && message) {
                fetch('https://script.google.com/macros/s/AKfycbzvOblwyAT2p4OTuKsXjy4UxvUwsrMPQmUqtiCwnxw/dev', {
                    method: 'POST',
                    body: JSON.stringify({ name, phone, location, message }),
                    headers: { 'Content-Type': 'application/json' }
                })
                .then(response => response.text())
                .then(() => {
                    document.getElementById("response").innerText = "Thank you, your surprise is on the way! 💕";
                })
                .catch(() => {
                    document.getElementById("response").innerText = "Oops! Something went wrong. Please try again.";
                });
            } else {
                document.getElementById("response").innerText = "Please fill out all fields!";
            }
        });
    </script>
</body>
</html>
